<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philip | Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            color: white;
        }

        /* Modern Glassmorphism Navbar */
        .navbar {
            background: rgba(255, 255, 255, 0.05); /* Very subtle white */
            backdrop-filter: blur(10px); /* The magic blur effect */
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 0;
            sticky: top;
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .nav-link {
            font-weight: 500;
            margin: 0 10px;
            transition: all 0.3s ease;
            opacity: 0.8;
        }

        .nav-link:hover {
            opacity: 1;
            color: #00d2ff !important; /* A bright accent color */
            transform: translateY(-2px);
        }

        /* Content spacing */
        .main-content {
            padding-top: 100px;
            min-height: calc(100vh - 150px);
        }

        .footer {
            padding: 40px 0;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" href="/">PHILIP</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto"> <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/about/">About</a></li>
                <li class="nav-item"><a class="nav-link" href="/skills/">Skills</a></li>
                <li class="nav-item"><a class="nav-link" href="/projects/">Projects</a></li>
                <li class="nav-item"><a class="nav-link" href="/education/">Education</a></li>
                <li class="nav-item"><a class="nav-link" href="/contact/">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container main-content">
    {% block content %}
    {% endblock %}
</div>

<footer class="footer text-center">
    <div class="container">
        <hr style="border-color: rgba(255,255,255,0.1)">
        <p>© 2026 Philip Angelo Gallo | Built with Django & Bootstrap</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
